
name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'zip apk folder .zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -q "zip apk folder .zip" -d project

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug --no-daemon
        working-directory: project/SSCMaths

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SSC-CGL-Maths-APK
          path: project/SSCMaths/app/build/outputs/apk/debug/app-debug.apk
